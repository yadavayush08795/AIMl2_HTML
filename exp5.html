<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    
</head>
<body>
    <center><h1>Student Registration Form</h1></center>
    <hr/>
    
        <label for="name" > Full name :</label>
        <input type="name" name="name" id="name" placeholder="Enter your name " >

        <br><br>
        <label for="email" >Email :</label>
        <input type="email" name="email" id="email" placeholder="Enter valid email address" >

        <br><br>
        <label for="password" > Password :</label>
        <input type="password" name="pass" id="pass" placeholder="Enter password" >


        <br><br>
        <label for="gender" >Gender :</label>
        <input type="radio" name ="gender" id = "name">
        <label for="gender" >Male </label>
        <input type="radio" name ="gender" id = "name">
        <label for="gender" >Female</label>
        <Br><br>
            <label for="lang" > -- Select Course -- :</label>

        <select name="lang" id="lang">
            <option value ="Select" >-- Select course --</option>
            <option value ="B.Tech" >B.Tech</option>
            <option value="MBBS" >MBBS</option>
            <option value ="BAMS" >BAMS</option>
            <option value="BCA" >BCA</option>
            <option value ="MBA">MBA</option>
            <option value ="BA">BA</option>
        </select>
        <br><br>
        <label for="tel" >Contact No:</label>

        <input type ="tel" name="tel" id="tel" placeholder="Enter phone number">

        <br><br>
        <label for="add" >Address :</label>
        <textarea id="add" name="add" name="address" rows="4" cols="50" placeholder="enter your address"></textarea>

        <br><br>
        <label for="submit" ></label>
        <input type="submit" value="Register">
        <input type="submit" value ="Clear">
        <hr>

        <footer>
            <br><br>
            <center>
            <copyright>&copy; 2026 Student Registration Portal</copyright>
            </center>
        </footer>
    

    
</body>
</html>
